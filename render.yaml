# Render Blueprint for the backend: New > Blueprint in the Render dashboard,
# pick this repo, then fill in the values marked "sync: false".
services:
  - type: web
    name: whatsapp-clone-api
    runtime: docker
    plan: free
    # Keep this next to the database region (Neon: AWS Asia Pacific - Singapore)
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # From Neon: jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Your Vercel URL, e.g. https://whatsapp-clone.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Random secret created by Render
      - key: JWT_SECRET
        generateValue: true
