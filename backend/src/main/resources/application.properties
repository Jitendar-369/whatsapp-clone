# Server
server.port=${PORT:8080}

# Local secrets (DB password, JWT secret) live in backend/local.properties,
# which is git-ignored. Copy local.properties.example to get started.
# Environment variables with the same names override them.
spring.config.import=optional:file:./local.properties

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chat_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Keep the pool small - free database plans allow few connections
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT - secret must be at least 32 characters
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# Sites allowed to call the API and open the WebSocket (comma-separated, * allowed).
# In production set CORS_ORIGINS to your frontend URL, e.g. https://whatsapp-clone.vercel.app
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Logging
logging.level.root=INFO
logging.level.realTime.Chat=DEBUG
