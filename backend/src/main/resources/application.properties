# Server
server.port=${PORT:8080}

# Local secrets (DB password, JWT secret) live in backend/local.properties,
# which is git-ignored. Copy local.properties.example to get started.
# Environment variables with the same names override them.
spring.config.import=optional:file:./local.properties

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chat_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT - secret must be at least 32 characters
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# Logging
logging.level.root=INFO
logging.level.realTime.Chat=DEBUG
